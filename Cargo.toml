[package]
name = "aimotion-desktop"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"

[dependencies]
gpui = { version = "=0.2.2", default-features = false, features = ["x11"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
fs2 = "0.4"
x11rb = "0.13"

[profile.dev]
debug = 0
incremental = false

[profile.release]
strip = true
